# From https://github.com/jonbaldie/software-factory. Rerun its installer to upgrade.
name: "Factory 3 · Fix"

# An agent addresses review feedback on a factory PR, then hands back to the reviewer.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: factory-pr-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:changes-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SETUP_COMMAND: ${{ vars.FACTORY_SETUP_COMMAND }}
      TEST_COMMAND: ${{ vars.FACTORY_TEST_COMMAND }}
    steps:
      - name: Find the PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "branch=$(gh pr view "$PR" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0 # the prompts come from the base branch
          persist-credentials: false

      - uses: actions/setup-node@v7 # the agent runs on Node
        with:
          node-version: 22

      - name: Build the fix prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "::error::Set the FACTORY_TEST_COMMAND repository variable to the command that runs your tests."
            exit 1
          fi
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          # The prompts come from the base branch, so a PR opened before a prompt change still gets the new one.
          # They're unpacked outside the checkout, where the agent's commit can't pick them up.
          prompts="$RUNNER_TEMP/factory"
          mkdir "$prompts" && git archive "origin/$base:.github/factory" | tar -x -C "$prompts"
          {
            cat "$prompts/fix.md"
            printf '\n## Test command\n\n```sh\n%s\n```\n\n' "$TEST_COMMAND"
            for n in $(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[].number'); do
              gh issue view "$n" --json number,title,body,comments | jq -r -f "$prompts/ticket.jq"
            done
            echo "## Latest review"
            gh pr view "$PR" --json comments \
              -q '[.comments[] | select(.body | contains("<!-- factory:review request_changes -->"))] | last | .body'
            echo
            echo "## Comments from maintainers"
            gh pr view "$PR" --json comments \
              -q '.comments[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR")) | "- @\(.author.login): \(.body)"'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Set up the project
        if: env.SETUP_COMMAND != ''
        run: eval "$SETUP_COMMAND"

      - name: Agent addresses the feedback
        id: agent
        uses: jonbaldie/software-factory/run-agent@v1
        with:
          name: fix-pr-${{ env.PR }}
          prompt-file: ${{ runner.temp }}/prompt.md
          harness: ${{ vars.FACTORY_HARNESS }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: "1.00"
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Push and hand back to the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          AGENT_SUMMARY: ${{ steps.agent.outputs.result }}
        run: |
          if [ -n "$(git status --porcelain -- .github)" ]; then
            echo "::error::The agent changed files under .github/, which the factory owns"
            exit 1
          fi
          git add -A
          # Feedback about the description alone, such as evidence the reviewer asked for, is answered in the summary with no commit.
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Address review feedback"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$BRANCH"
          elif [ -z "$AGENT_SUMMARY" ]; then
            echo "::error::The agent finished without changing any files or writing a summary"
            exit 1
          fi

          # The reviewer reads the description, so it hears what changed and why.
          {
            gh pr view "$PR" --json body -q .body
            printf '\n%s\n\n---\n_Fixed by the factory · [fix run](%s)_\n' "$AGENT_SUMMARY" "$RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md" --remove-label agent:changes-requested --add-label agent:review
          gh workflow run factory-review.yml -f pr="$PR"

      - name: Report failure
        if: failure() || cancelled() # a timeout or a cancel by hand counts as cancelled, not failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR" --remove-label agent:changes-requested --add-label agent:failed
          gh pr comment "$PR" --body "💥 The fix stage failed. [See the run]($RUN_URL). Re-add \`agent:changes-requested\` to retry."
