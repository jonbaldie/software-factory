# From https://github.com/jonbaldie/software-factory. Rerun its installer to upgrade.
name: "Factory 3 · Fix"

# An agent addresses review feedback on a factory PR, then hands back to the reviewer.
# The base branch is merged in first, so the agent also resolves any conflicts that would block the merge.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: factory-pr-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:changes-requested'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SETUP_COMMAND: ${{ vars.FACTORY_SETUP_COMMAND }}
      TEST_COMMAND: ${{ vars.FACTORY_TEST_COMMAND }}
    steps:
      - name: Leave assigned work to its assignee
        id: assigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An assignee on the PR or its issue owns the work, so every later step is skipped and the labels stay as they are.
          issues=$(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[].number')
          owners=$( { gh pr view "$PR" --json assignees -q '.assignees[].login'
            for n in $issues; do gh issue view "$n" --json assignees -q '.assignees[].login'; done; } | sort -u | sed 's/^/@/' | paste -sd' ' -)
          if [ -n "$owners" ]; then
            echo "owners=$owners" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --body "⏸️ This pull request or its issue is assigned to $owners, so the factory left it alone. To hand it back, unassign them, then remove and re-add \`agent:changes-requested\`."
          fi

      - name: Clear an earlier failure
        if: steps.assigned.outputs.owners == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "$PR" --remove-label agent:failed # Report failure adds it back if this run fails too

      - name: Find the PR branches
        id: pr
        if: steps.assigned.outputs.owners == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr view "$PR" --json headRefName,baseRefName -q '"branch=\(.headRefName)\nbase=\(.baseRefName)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.assigned.outputs.owners == ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0 # the prompts come from the base branch
          persist-credentials: false

      - uses: actions/setup-node@v7 # the agent runs on Node
        if: steps.assigned.outputs.owners == ''
        with:
          node-version: 22

      - name: Merge the base branch in
        if: steps.assigned.outputs.owners == ''
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          # Left uncommitted: conflicts stay marked for the agent, and the push step commits the merge with its work.
          if git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            merge --no-ff --no-commit "origin/$BASE"; then
            : > "$RUNNER_TEMP/conflicts.txt"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            if [ ! -s "$RUNNER_TEMP/conflicts.txt" ]; then
              echo "::error::Git couldn't merge $BASE into the branch"
              exit 1
            fi
          fi

      - name: Build the fix prompt
        if: steps.assigned.outputs.owners == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "::error::Set the FACTORY_TEST_COMMAND repository variable to the command that runs your tests."
            exit 1
          fi
          # The prompts come from the base branch, so a PR opened before a prompt change still gets the new one.
          # They're unpacked outside the checkout, where the agent's commit can't pick them up.
          prompts="$RUNNER_TEMP/factory"
          mkdir "$prompts" && git archive "origin/$BASE:.github/factory" | tar -x -C "$prompts"
          {
            cat "$prompts/fix.md"
            printf '\n## Test command\n\n```sh\n%s\n```\n\n' "$TEST_COMMAND"
            for n in $(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[].number'); do
              gh issue view "$n" --json number,title,body,comments | jq -r -f "$prompts/ticket.jq"
            done
            echo "## Latest review"
            # Only the factory's own reviews: anyone can post a comment with the marker.
            gh pr view "$PR" --json comments \
              -q '[.comments[] | select(.author.login == "github-actions" and (.body | contains("<!-- factory:review request_changes -->")))] | last | .body'
            echo
            if [ -s "$RUNNER_TEMP/conflicts.txt" ]; then
              printf '## Merge conflicts\n\n`%s` is merged into the working tree. These files have conflict markers:\n\n' "$BASE"
              sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
              echo
            fi
            echo "## Comments from maintainers"
            gh pr view "$PR" --json comments \
              -q '.comments[] | select(.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR")) | "- @\(.author.login): \(.body)"'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Set up the project
        if: steps.assigned.outputs.owners == '' && env.SETUP_COMMAND != ''
        run: eval "$SETUP_COMMAND"

      - name: Agent addresses the feedback
        id: agent
        if: steps.assigned.outputs.owners == ''
        uses: jonbaldie/software-factory/run-agent@v1
        with:
          name: fix-pr-${{ env.PR }}
          prompt-file: ${{ runner.temp }}/prompt.md
          harness: ${{ vars.FACTORY_HARNESS }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: "1.00"
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Push and hand back to the reviewer
        if: steps.assigned.outputs.owners == ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          BASE: ${{ steps.pr.outputs.base }}
          AGENT_SUMMARY: ${{ steps.agent.outputs.result }}
        run: |
          git add -A
          # The merge brings in the base branch's .github/, so any other difference there came from the agent.
          if ! git diff --cached --quiet "origin/$BASE" -- .github; then
            echo "::error::Files under .github/ differ from $BASE's. The factory owns that folder."
            exit 1
          fi
          while IFS= read -r file; do
            if grep -qsE '^(<<<<<<<|>>>>>>>)( |$)' -- "$file"; then
              echo "::error::The agent left conflict markers in $file"
              exit 1
            fi
          done < "$RUNNER_TEMP/conflicts.txt"
          # Feedback about the description alone, such as evidence the reviewer asked for, is answered in the summary with no commit.
          if git rev-parse -q --verify MERGE_HEAD > /dev/null || ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Address review feedback"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:$BRANCH"
          elif [ -z "$AGENT_SUMMARY" ]; then
            echo "::error::The agent finished without changing any files or writing a summary"
            exit 1
          fi

          # The reviewer reads the description, so it hears what changed and why.
          {
            gh pr view "$PR" --json body -q .body
            printf '\n%s\n\n---\n_Fixed by the factory · [fix run](%s)_\n' "$AGENT_SUMMARY" "$RUN_URL"
          } > "$RUNNER_TEMP/body.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md" --remove-label agent:changes-requested --add-label agent:review
          gh workflow run factory-review.yml -f pr="$PR"

      - name: Report failure
        if: failure() || cancelled() # a timeout or a cancel by hand counts as cancelled, not failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR" --remove-label agent:changes-requested --add-label agent:failed
          gh pr comment "$PR" --body "💥 The fix stage failed. [See the run]($RUN_URL). Re-add \`agent:changes-requested\` to retry."
