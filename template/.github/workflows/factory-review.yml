# From https://github.com/jonbaldie/software-factory. Rerun its installer to upgrade.
name: "Factory 2 · Review"

# A reviewer agent checks a factory PR against its ticket and AGENTS.md.
# Approve: merge. Request changes: hand to the fixer, up to MAX_ROUNDS, then escalate to a human.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: factory-pr-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:review'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      MAX_ROUNDS: 3
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SETUP_COMMAND: ${{ vars.FACTORY_SETUP_COMMAND }}
      TEST_COMMAND: ${{ vars.FACTORY_TEST_COMMAND }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7 # the agent runs on Node
        with:
          node-version: 22

      - name: Set up the project
        if: env.SETUP_COMMAND != ''
        run: eval "$SETUP_COMMAND"

      - name: Run the tests
        id: tests
        run: |
          if [ -z "$TEST_COMMAND" ]; then
            echo "::error::Set the FACTORY_TEST_COMMAND repository variable to the command that runs your tests."
            exit 1
          fi
          if eval "$TEST_COMMAND" > "$RUNNER_TEMP/tests.txt" 2>&1; then passed=true; else passed=false; fi
          cat "$RUNNER_TEMP/tests.txt"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Build the review prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName -q .baseRefName)
          # The prompts come from the base branch, so a PR opened before a prompt change still gets the new one.
          prompts="$RUNNER_TEMP/factory"
          mkdir "$prompts" && git archive "origin/$base:.github/factory" | tar -x -C "$prompts"
          issues=$(gh pr view "$PR" --json closingIssuesReferences -q '.closingIssuesReferences[].number')
          labels=$(for n in $issues; do gh issue view "$n" --json labels -q '.labels[].name'; done)
          {
            cat "$prompts/review.md"
            # The same method the implementer was given, so the reviewer checks its evidence.
            for category in bug enhancement; do
              if grep -qix "$category" <<<"$labels"; then echo; cat "$prompts/$category.md"; break; fi
            done
            echo
            for n in $issues; do
              gh issue view "$n" --json number,title,body,comments | jq -r -f "$prompts/ticket.jq"
            done
            echo "## Pull request description"
            echo
            gh pr view "$PR" --json body -q .body
            echo
            echo "## The diff"
            echo '````diff'
            git diff "origin/$base...HEAD"
            echo '````'
            echo "## Test output"
            echo '````'
            tail -n 40 "$RUNNER_TEMP/tests.txt"
            echo '````'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Agent reviews the change
        id: agent
        uses: jonbaldie/software-factory/run-agent@v1
        with:
          name: review-pr-${{ env.PR }}
          prompt-file: ${{ runner.temp }}/prompt.md
          harness: ${{ vars.FACTORY_HARNESS }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: "0.75"
          permission-mode: default
          allowed-tools: Read,Glob,Grep # the reviewer can look but not touch
          json-schema: >-
            {"type": "object", "required": ["verdict", "summary", "required_changes"], "properties": {
              "verdict": {"type": "string", "enum": ["approve", "request_changes"]},
              "summary": {"type": "string"},
              "required_changes": {"type": "array", "items": {"type": "string"}}}}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Act on the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ steps.agent.outputs.structured-output }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
        run: |
          verdict=$(jq -r .verdict <<<"$REVIEW")
          if [ "$TESTS_PASSED" != true ]; then verdict=request_changes; fi
          rounds=$(gh pr view "$PR" --json comments \
            -q '[.comments[].body | select(contains("<!-- factory:review request_changes -->"))] | length')
          round=$((rounds + 1))

          {
            echo "<!-- factory:review $verdict -->"
            if [ "$verdict" = approve ]; then
              echo "### ✅ Approved by the reviewer agent"
            else
              echo "### 🔁 Changes requested (round $round of $MAX_ROUNDS)"
            fi
            echo
            jq -r .summary <<<"$REVIEW"
            echo
            jq -r '.required_changes[] | "- " + .' <<<"$REVIEW"
            if [ "$TESTS_PASSED" != true ]; then
              printf '\n**Tests are failing:**\n```\n%s\n```\n' "$(tail -n 40 "$RUNNER_TEMP/tests.txt")"
            fi
            echo
            echo "_[Review run]($RUN_URL)_"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          gh pr edit "$PR" --remove-label agent:review

          if [ "$verdict" = approve ]; then
            gh pr edit "$PR" --add-label agent:approved
            # Run outside the checkout so gh doesn't try to switch local branches.
            if ! (cd "$RUNNER_TEMP" && gh pr merge "$PR" --squash --delete-branch); then
              gh pr edit "$PR" --add-label ready-for-human
              gh pr comment "$PR" --body "GitHub blocked the merge, usually because the branch needs a human approval or has a conflict. The PR box says which. Merge it yourself."
            fi
          elif [ "$round" -ge "$MAX_ROUNDS" ]; then
            gh pr edit "$PR" --add-label ready-for-human
          else
            gh pr edit "$PR" --add-label agent:changes-requested
            gh workflow run factory-fix.yml -f pr="$PR"
          fi

      - name: Report failure
        if: failure() || cancelled() # a timeout or a cancel by hand counts as cancelled, not failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "$PR" --remove-label agent:review --add-label agent:failed
          gh pr comment "$PR" --body "💥 The review stage failed. [See the run]($RUN_URL). Re-add \`agent:review\` to retry."
