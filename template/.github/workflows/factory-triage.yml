# From https://github.com/jonbaldie/software-factory. Rerun its installer to upgrade.
name: "Factory 0 · Triage"

# An issue labelled `needs-triage` gets a category, a state and a comment for whoever acts next.
# `ready-for-agent` hands it to the implementer.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # On the job, not the workflow: every label added to an issue starts both issue workflows, and a skipped run would cancel a queued one.
    concurrency:
      group: factory-issue-${{ github.event.issue.number || inputs.issue }}
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Clear an earlier failure
        id: before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ready-for-agent without agent:failed means the implementer has the ticket already.
          labels=$(gh issue view "$ISSUE" --json labels -q '.labels[].name')
          if grep -qx ready-for-agent <<<"$labels" && ! grep -qx agent:failed <<<"$labels"; then
            echo "implementing=true" >> "$GITHUB_OUTPUT"
          fi
          gh issue edit "$ISSUE" --remove-label agent:failed # Report failure adds it back if this run fails too

      - uses: actions/checkout@v7
        with:
          persist-credentials: false # keep the GitHub token out of the agent's sandbox

      - uses: actions/setup-node@v7 # the agent runs on Node
        with:
          node-version: 22

      - name: Build the triage prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The reporter wrote the body, so reading their replies to triage's questions trusts no one new.
          reporter=$(gh issue view "$ISSUE" --json author -q .author.login)
          {
            cat .github/factory/triage.md
            echo
            gh issue view "$ISSUE" --json number,title,body,comments | jq -r --arg reporter "$reporter" -f .github/factory/ticket.jq
            echo "## Other open tickets"
            echo
            gh issue list --state open --limit 500 --json number,title \
              | jq -r --argjson n "$ISSUE" '.[] | select(.number != $n) | "- #\(.number) \(.title)"'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Agent triages the ticket
        id: agent
        uses: jonbaldie/software-factory/run-agent@v1
        with:
          name: triage-issue-${{ env.ISSUE }}
          prompt-file: ${{ runner.temp }}/prompt.md
          harness: ${{ vars.FACTORY_HARNESS }}
          model: ${{ vars.FACTORY_MODEL }}
          max-budget-usd: "0.50"
          permission-mode: default
          allowed-tools: Read,Glob,Grep # the triager can look but not touch
          json-schema: >-
            {"type": "object", "required": ["category", "state", "comment"], "properties": {
              "category": {"type": "string", "enum": ["bug", "enhancement"]},
              "state": {"type": "string", "enum": ["ready-for-agent", "ready-for-human", "needs-info", "wontfix"]},
              "comment": {"type": "string"}}}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Act on the triage
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAGE: ${{ steps.agent.outputs.structured-output }}
          IMPLEMENTING: ${{ steps.before.outputs.implementing }}
        run: |
          category=$(jq -r .category <<<"$TRIAGE")
          state=$(jq -r .state <<<"$TRIAGE")
          {
            echo "> *This was generated by AI during triage.*"
            echo
            jq -r .comment <<<"$TRIAGE"
            echo
            echo "_[Triage run]($RUN_URL)_"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
          # One category and one state, replacing any an earlier triage chose.
          stale=$(printf '%s\n' needs-triage needs-info ready-for-agent ready-for-human wontfix bug enhancement \
            | grep -vx -e "$category" -e "$state" | paste -sd, -)
          gh issue edit "$ISSUE" --remove-label "$stale" --add-label "$category,$state"

          if [ "$state" = wontfix ]; then
            gh issue close "$ISSUE" --reason "not planned"
          elif [ "$state" = ready-for-agent ] && [ "$IMPLEMENTING" != true ]; then
            # Labels added with GITHUB_TOKEN don't trigger workflows, so hand off to the implementer explicitly.
            gh workflow run factory-implement.yml -f issue="$ISSUE"
          fi

      - name: Report failure
        if: failure() || cancelled() # a timeout or a cancel by hand counts as cancelled, not failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue edit "$ISSUE" --remove-label needs-triage --add-label agent:failed
          gh issue comment "$ISSUE" --body "💥 The triage stage failed. [See the run]($RUN_URL). Re-add \`needs-triage\` to retry."
