# From https://github.com/jonbaldie/software-factory. Rerun its installer to upgrade.
name: "Factory 4 · Scout"

# Daily: turn `TODO(factory):` comments into tickets for triage, and post a factory report.
# The scout uses no model itself. Each ticket it files starts a triage run.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC. GitHub often starts scheduled runs late.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  scout:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: File tickets for new TODOs
        run: |
          echo "## 🔭 Scouted TODOs" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state all --limit 1000 --json title -q '.[].title')
          # Markdown and .github are skipped because docs and the factory itself mention the marker.
          { git grep -n -F 'TODO(factory):' -- ':!*.md' ':!.github' || true; } | while IFS= read -r hit; do
            file=${hit%%:*}
            line=$(cut -d: -f2 <<<"$hit")
            title=${hit#*TODO(factory): }
            if grep -Fxq -- "$title" <<<"$existing"; then
              echo "- Already filed: $title" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            printf 'Found by the scout at %s/%s/blob/%s/%s#L%s. Delete that `TODO(factory):` comment as part of the change.\n' \
              "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_SHA" "$file" "$line" > "$RUNNER_TEMP/body.md"
            url=$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --label needs-triage)
            existing="$existing"$'\n'"$title"
            echo "- Filed $url: $title" >> "$GITHUB_STEP_SUMMARY"
            # Labels added with GITHUB_TOKEN don't trigger workflows, so start triage explicitly.
            if ! gh workflow run factory-triage.yml -f issue="${url##*/}"; then
              echo "- Couldn't start triage for $url. Remove and re-add \`needs-triage\` there to start it." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

      - name: Factory report
        run: |
          # gh lists 30 items unless told otherwise. Fetch one past the cap to tell a full count from a capped one.
          count() {
            local n
            n=$(gh "$@" --limit 1001 --json number -q length)
            if [ "$n" -gt 1000 ]; then echo "1000+"; else echo "$n"; fi
          }
          {
            echo
            echo "## 🏭 Factory report"
            echo
            echo "| Queue | Open |"
            echo "|---|---|"
            for label in needs-triage ready-for-agent agent:working agent:failed; do
              echo "| Issues labelled \`$label\` | $(count issue list --label "$label") |"
            done
            for label in agent:review agent:changes-requested agent:approved ready-for-human agent:failed; do
              echo "| PRs labelled \`$label\` | $(count pr list --label "$label") |"
            done
            since=$(date -u -d '7 days ago' +%F)
            echo "| Approved PRs merged since $since | $(count pr list --state merged --label agent:approved --search "merged:>=$since") |"
          } >> "$GITHUB_STEP_SUMMARY"
